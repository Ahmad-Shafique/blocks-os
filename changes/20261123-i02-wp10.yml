type: added
breaking: false
summary: The telemetry cold archive (Parquet files of logs and traces, Cloud.LmtService) can now live on an S3 or S3-compatible bucket instead of Azure Blob Storage. The store is chosen by configuration and Azure stays the default, so nothing changes unless the setting is made. IBlobStorage stays the seam; S3BlobStorage is the new implementation. S3 has no access tiers in this version, so saving does not set a tier, the tier state reports "not archived" and a rehydration request does nothing; use a lifecycle rule on the bucket for cold storage. Settings (in a container, environment variables with two underscores for a colon) - LmtArchive:Storage:Provider is Azure (default, uses the LmtBlobStorageConnectionString secret) or S3; LmtArchive:Storage:S3:ServiceUrl is the endpoint of an S3-compatible store such as http://s3:8333 and empty means AWS; LmtArchive:Storage:S3:Region defaults to us-east-1; LmtArchive:Storage:S3:AccessKey and LmtArchive:Storage:S3:SecretKey are required; LmtArchive:Storage:S3:ForcePathStyle defaults to true when a ServiceUrl is set. The bucket is the Container of the archive configuration, created if missing. Keys are never logged. AWSSDK.S3 3.7.410.6 (Apache-2.0, the version the storage driver already brings) is now referenced by Cloud.LmtService.
